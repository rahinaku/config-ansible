- name: "Create container dir"
  file:
    path: "/home/{{ ansible_facts['user_id'] }}/container/cloudflare-tunnel"
    state: "directory"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0755"

- name: "Copy docker-compose directory"
  copy:
    src: "cloudflare-tunnel/"
    dest: "/home/{{ ansible_facts['user_id'] }}/container/cloudflare-tunnel"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0755"
